<text x="128" y="283" fill="#1c2733" font-size="12">a</text>
<text x="125" y="268" fill="#0F6E56" font-size="12">w</text>
<text x="120" y="338" text-anchor="middle" fill="#5c6b7a" font-size="12">fiber</text>
<text x="120" y="356" text-anchor="middle" fill="#1c2733" font-size="12">a 4.1, w 5.2 µm</text>
<circle cx="320" cy="288" r="23" fill="none" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="320" cy="288" r="21" fill="#D3D1C7" stroke="#888780"/>
<line x1="320" y1="288" x2="341" y2="288" stroke="#5c6b7a" stroke-width="1" marker-end="url(#m1)"/>
<line x1="320" y1="288" x2="320" y2="265" stroke="#1D9E75" stroke-width="1" marker-end="url(#m1)"/>
<text x="327" y="283" fill="#1c2733" font-size="12">a</text>
<text x="325" y="274" fill="#0F6E56" font-size="12">w</text>
<text x="320" y="338" text-anchor="middle" fill="#5c6b7a" font-size="12">glass guide at Δn 0.01</text>
<text x="320" y="356" text-anchor="middle" fill="#1c2733" font-size="12">a 3.4, w 3.8 µm</text>
<circle cx="540" cy="288" r="31" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="540" cy="288" r="23" fill="#CECBF6" stroke="#6b4fa0" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="540" y="338" text-anchor="middle" fill="#5c6b7a" font-size="12">the two modes, superimposed</text>
<text x="540" y="356" text-anchor="middle" fill="#8a5a1b" font-size="12">0.44 dB lost to size alone</text>
