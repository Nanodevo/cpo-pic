<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 680 322" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>What the polarization P is, physically</title>
<desc>Three panels. Left: one atom with no light present. The negative electron cloud is centred on the positive nucleus, so the atom has no dipole. Middle: the electric field of a passing light wave pushes the electron cloud one way and the nucleus the other, separating their centres by a tiny amount and creating an electric dipole. Right: every atom in the material does this at once, and the polarization P is the total dipole moment per unit volume.</desc>
<rect x="0" y="0" width="680" height="322" fill="#fbfcfd"/>
<defs>
<marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b6ca8"/></marker>
<marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a1b"/></marker>
</defs>
<text x="130" y="40" text-anchor="middle" fill="#1c2733" font-size="13">no light</text>
<circle cx="130" cy="140" r="44" fill="#cfe0f0" stroke="#8fb4d6"/>
<circle cx="130" cy="140" r="7" fill="#c0392b"/>
<text x="130" y="145" text-anchor="middle" fill="#fff" font-size="11">+</text>
<text x="96" y="106" fill="#5c6b7a" font-size="11">−</text>
<text x="130" y="212" text-anchor="middle" fill="#5c6b7a" font-size="12">electron cloud centred</text>
<text x="130" y="229" text-anchor="middle" fill="#5c6b7a" font-size="12">on the nucleus</text>
<text x="130" y="252" text-anchor="middle" fill="#1c2733" font-size="12">no dipole</text>
<text x="340" y="40" text-anchor="middle" fill="#1c2733" font-size="13">light passing through</text>
<line x1="272" y1="72" x2="408" y2="72" stroke="#1b6ca8" stroke-width="2" marker-end="url(#s1)"/>
<text x="416" y="76" fill="#1b6ca8" font-size="12">E</text>
<text x="272" y="64" fill="#5c6b7a" font-size="11">the light&#8217;s own electric field</text>
<circle cx="326" cy="140" r="44" fill="#cfe0f0" stroke="#8fb4d6"/>
<circle cx="352" cy="140" r="7" fill="#c0392b"/>
<text x="352" y="145" text-anchor="middle" fill="#fff" font-size="11">+</text>
<text x="292" y="106" fill="#5c6b7a" font-size="11">−</text>
<line x1="326" y1="168" x2="352" y2="168" stroke="#8a5a1b" stroke-width="2" marker-end="url(#s2)"/>
<text x="340" y="186" text-anchor="middle" fill="#8a5a1b" font-size="12">p</text>
<text x="340" y="212" text-anchor="middle" fill="#5c6b7a" font-size="12">cloud pushed one way,</text>
<text x="340" y="229" text-anchor="middle" fill="#5c6b7a" font-size="12">nucleus the other</text>
<text x="340" y="252" text-anchor="middle" fill="#1c2733" font-size="12">one tiny dipole, p</text>
<text x="550" y="40" text-anchor="middle" fill="#1c2733" font-size="13">every atom at once</text>
<g stroke="#8fb4d6" fill="#cfe0f0">
<circle cx="496" cy="104" r="16"/><circle cx="550" cy="104" r="16"/><circle cx="604" cy="104" r="16"/>
<circle cx="496" cy="150" r="16"/><circle cx="550" cy="150" r="16"/><circle cx="604" cy="150" r="16"/>
<circle cx="496" cy="196" r="16"/><circle cx="550" cy="196" r="16"/><circle cx="604" cy="196" r="16"/>
</g>
<g stroke="#8a5a1b" stroke-width="1.6" marker-end="url(#s2)">
<line x1="490" y1="104" x2="504" y2="104"/><line x1="544" y1="104" x2="558" y2="104"/><line x1="598" y1="104" x2="612" y2="104"/>
<line x1="490" y1="150" x2="504" y2="150"/><line x1="544" y1="150" x2="558" y2="150"/><line x1="598" y1="150" x2="612" y2="150"/>
<line x1="490" y1="196" x2="504" y2="196"/><line x1="544" y1="196" x2="558" y2="196"/><line x1="598" y1="196" x2="612" y2="196"/>
</g>
<text x="550" y="234" text-anchor="middle" fill="#5c6b7a" font-size="12">add up all the little p&#8217;s</text>
<text x="550" y="252" text-anchor="middle" fill="#1c2733" font-size="12">per cubic metre, and that is P</text>
<text x="40" y="292" fill="#5c6b7a" font-size="12">P is the polarization of the material: how far the charges inside it have been pulled apart, per unit volume.</text>
<text x="40" y="310" fill="#5c6b7a" font-size="12">E is the electric field of the light itself. Nothing else in the scene is charged or applying a field.</text>
</svg>
