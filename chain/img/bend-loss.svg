<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 680 348" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Why a bent waveguide leaks: the conformal picture</title>
<desc>Left: a waveguide curving to the left, with light escaping from its outer edge. Right: the equivalent straight waveguide, in which bending appears as a tilt of the refractive index that rises with transverse position. The guided mode's effective index is a horizontal line. Where the tilted cladding index rises to meet it, at the critical position x sub c, the light is no longer bound and radiates. Between the core edge and that crossing lies a barrier the mode has to tunnel through, and the barrier gets wider as the bend radius grows.</desc>
<rect x="0" y="0" width="680" height="348" fill="#fbfcfd"/>
<defs>
<marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker>
<marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b7a"/></marker>
<marker id="b3" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c6b7a"/></marker>
</defs>
<text x="30" y="40" fill="#1c2733" font-size="14">the bend, as it is</text>
<path d="M100.0,114.1 A144.0,144.0 0 0 1 228.5,204.1 L204.4,213.8 A118.0,118.0 0 0 0 99.1,140.1 Z" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.2"/>
<circle cx="95.0" cy="258.0" r="3" fill="#5c6b7a"/>
<line x1="95.0" y1="258.0" x2="170.1" y2="150.7" stroke="#5c6b7a" stroke-width="1" stroke-dasharray="4,4"/>
<text x="117" y="198" fill="#5c6b7a" font-size="13">R</text>
<text x="34" y="282" fill="#5c6b7a" font-size="12">centre of the bend</text>
<line x1="144.3" y1="122.7" x2="157.9" y2="85.1" stroke="#D85A30" stroke-width="1.4" marker-end="url(#b1)"/>
<line x1="187.6" y1="147.7" x2="213.3" y2="117.0" stroke="#D85A30" stroke-width="1.4" marker-end="url(#b1)"/>
<line x1="219.7" y1="186.0" x2="254.3" y2="166.0" stroke="#D85A30" stroke-width="1.4" marker-end="url(#b1)"/>
<text x="246" y="94" fill="#D85A30" font-size="12">radiates</text>
<text x="246" y="111" fill="#D85A30" font-size="12">outward</text>
<text x="30" y="306" fill="#5c6b7a" font-size="12">the far side of the mode would have to</text>
<text x="30" y="323" fill="#5c6b7a" font-size="12">outrun light to keep the phase front together</text>
<text x="30" y="58" fill="#8a5a1b" font-size="12">true arc; bend drawn far tighter than reality</text>
<text x="360" y="40" fill="#1c2733" font-size="14">the same bend, straightened out</text>
<rect x="435" y="60" width="50" height="200" fill="#FAEEDA"/>
<line x1="370" y1="260" x2="655" y2="260" stroke="#5c6b7a" stroke-width="1"/>
<line x1="370" y1="215" x2="650" y2="120" stroke="#6b4fa0" stroke-width="2"/>
<polygon points="405,203 405,163 435,153 435,193" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="370" y1="176" x2="650" y2="176" stroke="#1b6ca8" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="372" y="170" fill="#1b6ca8" font-size="12">n_eff</text>
<text x="505" y="128" fill="#6b4fa0" font-size="12">cladding index, tilted</text>
<text x="505" y="145" fill="#6b4fa0" font-size="12">n(1 + x/R)</text>
<circle cx="485" cy="176" r="3.5" fill="#1b6ca8"/>
<line x1="485" y1="176" x2="485" y2="260" stroke="#5c6b7a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="478" y="278" fill="#1c2733" font-size="13">x_c</text>
<path d="M485,176 q9,-12 18,0 q9,12 18,0 q9,-12 18,0 q9,12 18,0 q9,-12 18,0 q9,12 18,0 q9,-12 18,0" fill="none" stroke="#D85A30" stroke-width="1.6"/>
<text x="556" y="204" fill="#D85A30" font-size="12">radiates</text>
<text x="420" y="278" fill="#5c6b7a" font-size="12" text-anchor="middle">core</text>
<line x1="437" y1="292" x2="483" y2="292" stroke="#5c6b7a" stroke-width="1" marker-start="url(#b3)" marker-end="url(#b2)"/>
<text x="460" y="310" fill="#854F0B" font-size="12" text-anchor="middle">barrier</text>
<text x="30" y="340" fill="#1c2733" font-size="12">the barrier gets wider as R grows, and tunnelling is exponential in barrier width</text>
</svg>
