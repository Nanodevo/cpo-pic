<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 680 412" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>The bend at its own scale, with a magnified view of where the radiation caustic sits</title>
<desc>Left: a waveguide bend of 15 millimetre radius, drawn at its true scale, where the waveguide itself is thinner than the line. Right: the same guide magnified 250 times, showing the 8 micrometre core, the barrier above it, the caustic 21 micrometres out from the axis, and light radiating beyond it. At bend scale the caustic lies only 0.14 percent outside the guide and cannot be drawn separately from it.</desc>
<rect x="0" y="0" width="680" height="412" fill="#fbfcfd"/>
<defs>
<marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker>
<marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b7a"/></marker>
<marker id="c3" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c6b7a"/></marker>
</defs>
<text x="26" y="40" fill="#1c2733" font-size="14">the bend at its own scale</text>
<path d="M110.9,100.9 A240.0,240.0 0 0 1 307.5,238.6" fill="none" stroke="#1D9E75" stroke-width="2.4"/>
<circle cx="90.0" cy="340.0" r="3" fill="#5c6b7a"/>
<line x1="90.0" y1="340.0" x2="227.7" y2="143.4" stroke="#5c6b7a" stroke-width="1" stroke-dasharray="4,4"/>
<text x="150" y="300" fill="#5c6b7a" font-size="13">R = 15 mm</text>
<text x="26" y="358" fill="#5c6b7a" font-size="12">the whole waveguide is thinner than that green line:</text>
<text x="26" y="375" fill="#5c6b7a" font-size="12">8 µm of glass on a 15 mm radius</text>
<text x="26" y="398" fill="#8a5a1b" font-size="12">the caustic lies 21 µm outside the arc, 0.14% of R</text>
<rect x="218.7" y="134.4" width="18" height="18" fill="none" stroke="#5c6b7a" stroke-width="1"/>
<line x1="236.7" y1="134.4" x2="330.0" y2="62.0" stroke="#a9b4bf" stroke-width="1"/>
<line x1="236.7" y1="152.4" x2="330.0" y2="302.0" stroke="#a9b4bf" stroke-width="1"/>
<rect x="330.0" y="62.0" width="322.0" height="240.0" fill="#fff" stroke="#5c6b7a" stroke-width="1"/>
<text x="330.0" y="52" fill="#1c2733" font-size="14">the same guide, magnified 250 times</text>
<rect x="331.0" y="183.9" width="320.0" height="32.2" fill="#9FE1CB"/>
<rect x="331.0" y="116.8" width="320.0" height="67.1" fill="#FAEEDA"/>
<line x1="331.0" y1="116.8" x2="651.0" y2="116.8" stroke="#1b6ca8" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="331.0" y1="200.0" x2="651.0" y2="200.0" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3,3"/>
<path d="M470,101 q9,-11 18,0 q9,11 18,0 q9,-11 18,0 q9,11 18,0 q9,-11 18,0 q9,11 18,0 q9,-11 18,0 q9,11 18,0 q9,-11 18,0 q9,11 18,0" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<line x1="600" y1="103" x2="628" y2="87" stroke="#D85A30" stroke-width="1.4" marker-end="url(#c1)"/>
<text x="340.0" y="205" fill="#0F6E56" font-size="12">core</text>
<text x="340.0" y="154" fill="#854F0B" font-size="12">barrier</text>
<text x="340" y="109" fill="#1b6ca8" font-size="12">caustic, x_c = 21 µm</text>
<text x="340.0" y="83" fill="#D85A30" font-size="12">radiates</text>
<line x1="612.0" y1="200.0" x2="612.0" y2="183.9" stroke="#5c6b7a" stroke-width="1" marker-start="url(#c3)" marker-end="url(#c2)"/>
<text x="556.0" y="196" fill="#5c6b7a" font-size="12">a = 4 µm</text>
<line x1="346.0" y1="290" x2="386.0" y2="290" stroke="#1c2733" stroke-width="2"/>
<text x="392.0" y="294" fill="#1c2733" font-size="12">10 µm</text>
<text x="340" y="252" fill="#5c6b7a" font-size="12">inward side: the tilt pushes the index down here,</text>
<text x="340" y="269" fill="#5c6b7a" font-size="12">so the mode is squeezed outward, away from centre</text>
</svg>